name: Collect market notes
on:
  schedule:
    - cron: '23 3 * * *'
    - cron: '53 15 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: jobs-update
  cancel-in-progress: false
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect headlines (titles and links only)
        run: node scripts/collect-notes.mjs
      - name: Save
        run: |
          git config user.name "padimachi-jobs-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Collect market notes"; git pull -q --rebase || true; git push; fi
      - name: Update the approval issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Market notes waiting for your approval"
          node scripts/collect-notes.mjs issue > /tmp/body.md
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number,title -q '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -z "$NUM" ]; then gh issue create --title "$TITLE" --body-file /tmp/body.md; else gh issue edit "$NUM" --body-file /tmp/body.md; fi
