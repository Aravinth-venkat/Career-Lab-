name: Check links
on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every link in the website
        run: node scripts/check-links.mjs
      - name: Save the result
        run: |
          git config user.name "padimachi-links-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/links.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Link check result"; git pull -q --rebase || true; git push; fi
