name: Update reading list
on:
  schedule:
    - cron: '10 4 * * 0'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: jobs-update
  cancel-in-progress: false
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the reading list and check free links
        run: node scripts/reading-build.mjs
      - name: Save
        run: |
          git config user.name "padimachi-reading-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/reading.json data/reading-health.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update reading list"; git pull -q --rebase || true; git push; fi
