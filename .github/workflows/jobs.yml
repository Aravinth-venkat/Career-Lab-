name: Update job openings
on:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '47 1-23/3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: jobs-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch public job boards
        run: node scripts/fetch-jobs.mjs
      - name: Save only when something changed
        run: |
          git config user.name "padimachi-jobs-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update job openings"; git push; fi
      - name: Ask GitHub Pages to publish the new data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
