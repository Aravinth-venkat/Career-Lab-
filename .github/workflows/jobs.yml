name: Update job openings
on:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '47 1-23/3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  issues: write
concurrency:
  group: jobs-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch public job boards
        run: node scripts/fetch-jobs.mjs
      - name: Save only when something changed
        run: |
          git config user.name "padimachi-jobs-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update job openings"; git pull -q --rebase || true; git push; fi
      - name: Raise or clear the alert issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="⚠️ Job updater needs attention"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number,title -q '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          ALERT=$(node -e "const s=require('./data/status.json');console.log(s.alert?s.alert.issues.join('; '):'')")
          if [ -n "$ALERT" ]; then
            BODY="The job updater found a problem on two runs in a row: $ALERT. Check the latest run in the Actions tab. This issue closes by itself when things recover."
            if [ -z "$NUM" ]; then gh issue create --title "$TITLE" --body "$BODY"; else gh issue comment "$NUM" --body "$BODY"; fi
          elif [ -n "$NUM" ]; then gh issue close "$NUM" --comment "Recovered. The latest run was healthy."; fi
      - name: Ask GitHub Pages to publish the new data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
