name: Search pages
on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: jobs-update
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the job pages and the sitemap
        run: node scripts/seo-pages.mjs
      - name: Save only when something changed
        run: |
          git config user.name "padimachi-seo-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add openings sitemap.xml
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update search pages"; git pull -q --rebase || true; git push; fi
      - name: Ask GitHub Pages to publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
